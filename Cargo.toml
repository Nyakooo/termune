[package]
name = "termune"
version = "0.1.7"
edition = "2024"
description = "Terminal library browser for Feiniu Music"
repository = "https://github.com/Nyakooo/termune"

[dependencies]
cpal = "0.16"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
symphonia-adapter-libopus = "0.3"
rubato = "0.16"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
directories = "6"
getrandom = "0.2"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde_json = "1"
semver = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
self-replace = "1.5"
keyring = { version = "3.6.3", features = ["windows-native"] }

[profile.release]
strip = true
