name: Build, test and release
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  installers:
    name: Test installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Unix installer fixture tests
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          python tests/install_unix.py
      - name: Windows PowerShell 5.1 installer fixture tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/install_windows.ps1
      - name: PowerShell 7 installer fixture tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install_windows.ps1
  build:
    name: Test and package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libdbus-1-dev libasound2-dev
      - name: Validate version and packaging tests
        run: |
          python scripts/package_release.py --check
          python -m unittest discover -s tests -p '*_test.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check command-line entry points
        run: |
          target/${{ matrix.target }}/release/termune${{ matrix.extension }} --version
          target/${{ matrix.target }}/release/termune${{ matrix.extension }} --help
      - name: Package executable and documentation
        run: python scripts/package_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: termune-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: [build, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: termune-*
          merge-multiple: true
          path: dist
      - name: Validate complete assets and generate SHA256SUMS
        run: python3 scripts/package_release.py --checksums
      - name: Extract notes for this release only
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/extract_release_notes.py \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish archives, update binaries and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            args=( --verify-tag --title "Termune $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" )
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=( --prerelease ); fi
            gh release create "$RELEASE_TAG" "${args[@]}" dist/*
          fi
